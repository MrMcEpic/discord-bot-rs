[package]
name = "mcp-gateway"
version = "0.13.2"
edition = "2021"
description = "MCP gateway that routes Model Context Protocol requests across multiple discord-bot-rs instances."
license = "AGPL-3.0-or-later"
repository = "https://github.com/MrMcEpic/discord-bot-rs"
homepage = "https://mrmcepic.github.io/discord-bot-rs"
readme = "../README.md"
keywords = ["discord", "mcp", "gateway"]
categories = ["network-programming"]
authors = ["MrMcEpic"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
subtle = "2"
