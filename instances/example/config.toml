# ============================================================================
# discord-bot-rs — Example Instance Configuration
# ============================================================================
#
# This file is the authoritative reference for every config.toml option.
# Copy this whole directory to create a new instance:
#
#     cp -r instances/example instances/mybot
#
# Then edit this file, instances/mybot/.env, and instances/mybot/personality.txt.
#
# Full documentation: https://mrmcepic.github.io/discord-bot-rs/configuration/
# ============================================================================


# ----- Identity -------------------------------------------------------------

# Display name shown in bot output (help text, welcome messages, etc.)
bot_name = "Example Bot"

# Prefix for all user commands. discord-bot-rs uses prefix commands only
# (no slash commands), so this is the single prefix every user sees.
command_prefix = "!"

# Parent command name. Default "m" gives users `<prefix>m <subcommand>` (e.g.
# `!m play`). Useful tweaks:
#   command_root = "bot"  → `<prefix>bot play` (separates two bots in one guild)
#   command_root = ""     → `<prefix>play` (flat: every subcommand at the root)
# Must be a single token (no whitespace). Default if omitted: "m".
command_root = "m"

# Path to the personality file (system prompt for AI chat), relative to this
# config file. Default: "personality.txt"
personality_file = "personality.txt"


# ----- Feature Flags --------------------------------------------------------
#
# Each flag gates a whole feature area. Setting to false disables the feature
# entirely — the corresponding config section below is not required.

[features]
minecraft = false     # Minecraft verification + donator sync + chargeback alerts
auto_role = false     # Automatic role promotion based on activity
join_role = false     # Assign a role to new members on join
welcome = false       # AI-generated welcome message on join


# ----- AI Provider Definitions (CONFIG-DRIVEN, OPTIONAL) -------------------
#
# Define your own AI providers. Default registry (deepseek_chat,
# deepseek_reasoner, gemini_flash, grok) is preserved when this section is
# absent — see docs/configuration/ai-providers.md for the field reference
# and defaults/example-providers.toml for copy-paste examples (Mistral,
# OpenAI, OpenRouter, Ollama localhost, etc.).

# [ai.providers.my_local]
# url = "http://localhost:11434/v1/chat/completions"
# model = "llama3.1:70b"
# api_key_env = "LOCAL_LLM_KEY"
# max_tokens = 8192
# # Optional fields with defaults shown:
# # timeout_secs = 30
# # supports_vision = false
# # supports_tools = true
# # is_reasoner = false


# ----- AI Routing (OPTIONAL) -----------------------------------------------
#
# Override which configured provider plays which role. Section absent =
# default matrix (chat=deepseek_chat / vision=gemini_flash /
# reasoner=deepseek_reasoner). Section present = only the keys you write
# take effect — omitted vision/reasoner means "graceful degrade".
#
# Single-model setup example (just `chat`, vision/reasoner omitted):

# [ai.routing]
# chat = "my_local"


# ----- AI Fallback (CENSORED cascade) ---------------------------------------
#
# Optional. When the primary AI provider returns its content-moderation
# refusal sentinel (DeepSeek's "Content Exists Risk" → CENSORED), retry the
# same conversation through these providers in order. First non-CENSORED
# success wins; if every entry also CENSORS, the bot falls back to its
# existing snarky-reply canned message.
#
# Recognised names: "grok" (xAI, requires GROK_API_KEY), "gemini" (requires
# GEMINI_API_KEY), "deepseek" (typically pointless as a fallback for
# DeepSeek censorship, but available for completeness). Unknown names and
# names whose API key isn't set are skipped at startup with a warning.
#
# Default: empty (no cascade — strict-moderation servers keep the snarky
# refusal behaviour).

# [ai.fallback]
# on_censored = ["grok", "gemini"]


# ----- Auto-Role Promotion --------------------------------------------------
#
# Required when features.auto_role = true.
# Promotes members from `from_role` to `to_role` once they meet activity
# criteria. Runs periodically; the first pass happens at bot startup.

# [auto_role]
# from_role = "ROLE_ID"       # Snowflake of the role to remove
# to_role = "ROLE_ID"         # Snowflake of the role to grant
# min_age = "3d"              # Time in guild before eligible (e.g. "1h", "3d", "1w")
# min_messages = 20           # Messages sent in the guild before eligible
# require_all = false         # true = both criteria required, false = either


# ----- Join Role ------------------------------------------------------------
#
# Required when features.join_role = true.
# Assigns this role to every new member on join. Typically used to mark
# unverified/new members.

# [join_role]
# role = "ROLE_ID"            # Snowflake of the role to grant on join


# ----- Welcome Messages -----------------------------------------------------
#
# Required when features.welcome = true.
# Sends an AI-generated welcome message to the specified channel when a new
# member joins. The prompt file controls tone and content.

# [welcome]
# channel = "CHANNEL_ID"
# prompt_file = "welcome_prompt.txt"   # Relative to this config file


# ----- Minecraft Module -----------------------------------------------------
#
# Required when features.minecraft = true.
# Any sub-feature can be independently toggled.
# MC_VERIFY_URL and MC_VERIFY_SECRET in .env are required for all sub-features.

# [minecraft]
# verify = true               # !m verify command (default: true)
# donator_sync = false        # Poll MC server for donator tier role sync
# chargeback = false          # Webhook listener for chargeback alerts


# ----- Donator Sync ---------------------------------------------------------
#
# Required when minecraft.donator_sync = true.
# Polls the MC server on interval and syncs donator roles based on response.

# [minecraft.donator_sync_config]
# supporter_role = "ROLE_ID"
# premium_role = "ROLE_ID"
# check_interval = 300        # Poll interval in seconds (default: 300)


# ----- Chargeback Alerts ----------------------------------------------------
#
# Required when minecraft.chargeback = true.
# Webhook endpoint (POST /webhook/chargeback) strips roles, applies restricted
# role, posts interactive staff alert with Ban/Dismiss buttons.

# [minecraft.chargeback_config]
# staff_channel = "CHANNEL_ID"
# restricted_role = "ROLE_ID"
# staff_roles = ["MOD_ROLE_ID", "ADMIN_ROLE_ID", "OWNER_ROLE_ID"]   # Snowflakes allowed to press Ban/Dismiss; empty = no one
