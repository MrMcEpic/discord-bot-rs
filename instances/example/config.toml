# ============================================================================
# discord-bot-rs — Example Instance Configuration
# ============================================================================
#
# This file is the authoritative reference for every config.toml option.
# Copy this whole directory to create a new instance:
#
#     cp -r instances/example instances/mybot
#
# Then edit this file, instances/mybot/.env, and instances/mybot/personality.txt.
#
# Full documentation: https://mrmcepic.github.io/discord-bot-rs/configuration/
# ============================================================================


# ----- Identity -------------------------------------------------------------

# Display name shown in bot output (help text, welcome messages, etc.)
bot_name = "Example Bot"

# Prefix for all user commands. discord-bot-rs uses prefix commands only
# (no slash commands), so this is the single prefix every user sees.
command_prefix = "!"

# Parent command name. Default "m" gives users `<prefix>m <subcommand>` (e.g.
# `!m play`). Useful tweaks:
#   command_root = "bot"  → `<prefix>bot play` (separates two bots in one guild)
#   command_root = ""     → `<prefix>play` (flat: every subcommand at the root)
# Must be a single token (no whitespace). Default if omitted: "m".
command_root = "m"

# Path to the personality file (system prompt for AI chat), relative to this
# config file. Default: "personality.txt"
personality_file = "personality.txt"

# IANA timezone name for the AI system prompt's date/time line. When set, the
# prompt gives the model the local date, local clock time, IANA zone name,
# and numeric UTC offset — e.g.
#
#   Today is Friday, April 17, 2026. Current local time: 10:52 PM
#   (America/Toronto, UTC-04:00).
#
# When unset, the prompt falls back to UTC and labels it as such. Leaving this
# unset is fine for non-chat workloads, but for any community where users ask
# time-of-day questions (and the whole of AI chat basically does), a bare-UTC
# prompt causes the model to report tomorrow's date whenever a user is chatting
# late at night local time. Use the full IANA name so DST is handled correctly
# — "EST" / "PST" / etc. are rejected at startup. Examples:
#
#   timezone = "America/Toronto"
#   timezone = "America/Los_Angeles"
#   timezone = "Europe/London"
#   timezone = "Asia/Tokyo"
#
# Default: unset (UTC with explicit label).
# timezone = "America/Toronto"


# ----- Feature Flags --------------------------------------------------------
#
# Each flag gates a whole feature area. Setting to false disables the feature
# entirely — the corresponding config section below is not required.

[features]
minecraft = false     # Minecraft verification + donator sync + chargeback alerts
auto_role = false     # Automatic role promotion based on activity
join_role = false     # Assign a role to new members on join
welcome = false       # AI-generated welcome message on join


# ----- AI Provider Definitions (CONFIG-DRIVEN, OPTIONAL) -------------------
#
# Define your own AI providers. The baked-in defaults live in
# defaults/providers.toml (deepseek_flash, deepseek_flash_max,
# deepseek_flash_fast, deepseek_pro, gemini_flash, grok) and only need
# DEEPSEEK_API_KEY. A block here with the same name as a default replaces
# that default wholesale (no field merge). See
# docs/configuration/ai-providers.md for the field reference and
# defaults/example-providers.toml for copy-paste examples (Mistral, OpenAI,
# OpenRouter, Ollama localhost, etc.).

# [ai.providers.my_local]
# url = "http://localhost:11434/v1/chat/completions"
# model = "llama3.1:70b"
# api_key_env = "LOCAL_LLM_KEY"
# max_tokens = 8192
# # Optional fields with defaults shown:
# # timeout_secs = 30
# # supports_vision = false
# # supports_tools = true          # the only switch for tool use
# # is_reasoner = false
# # extra_body = {}                # merged into every request body
# # refusal_markers = []           # error-body substrings meaning "filtered"


# ----- AI Routing (OPTIONAL) -----------------------------------------------
#
# Override which configured provider plays which role. Section absent =
# default matrix:
#   chat = "deepseek_flash"           (V4.1 Flash, reasoning_effort = high)
#   vision = "deepseek_flash"
#   reasoner = "deepseek_flash_max"   (same model, reasoning_effort = max)
#   fast = "deepseek_flash_fast"      (thinking off: classifier + refusal judge)
# Section present = only the keys you write take effect: `chat` is required,
# omitted vision / reasoner are disabled, and omitted `fast` becomes
# deepseek_flash_fast if chat is on DeepSeek, otherwise chat itself.
# Old names (deepseek_chat, deepseek_reasoner, gemini, ...) still resolve.
#
# Single-model setup example (just `chat`):

# [ai.routing]
# chat = "my_local"

# Opting into DeepSeek V4-Pro (text-only, no tools; the fast provider runs
# web searches for it first) as the reasoner:
#
# [ai.routing]
# chat = "deepseek_flash"
# vision = "deepseek_flash"
# reasoner = "deepseek_pro"
# fast = "deepseek_flash_fast"
#
# Or disable the reasoner role altogether (the classifier call is skipped
# and every chat goes through the chat role):
#
# [ai.routing]
# chat = "deepseek_flash"
# vision = "deepseek_flash"
# fast = "deepseek_flash_fast"
# # reasoner intentionally omitted


# ----- AI Fallback (cascade) ------------------------------------------------
#
# Optional. When the provider that was asked returns a filtered answer
# (DeepSeek's "Content Exists Risk" error, finish_reason = content_filter,
# or an HTTP 200 in-character dodge caught by the refusal check), retry the
# same conversation through `on_censored` in order. First success wins. If
# nothing can answer a hard-filtered request, the bot sends `censored_reply`
# (an unanswered soft refusal is sent as-is). Image requests only use the
# vision-capable members.
#
# Names: "grok" (requires GROK_API_KEY), "gemini_flash" (requires
# GEMINI_API_KEY), any [ai.providers.*] you defined, or an alias such as
# "gemini" / "xai". Unknown names and names whose API key isn't set are
# skipped with a startup warning.
#
# Default: on_censored empty (no cascade; strict-moderation servers keep the
# canned reply) and the refusal check then never runs.

# [ai.fallback]
# on_censored = ["grok", "gemini_flash"]
# on_error = false                 # true = also fail over on HTTP / timeout / credit errors
# refusal_check = true             # catch soft (HTTP 200) refusals via the fast provider
# refusal_check_max_chars = 1200   # longer replies skip the check
# # refusal_check_prompt = "..."   # custom judge prompt; must ask for yes/no only
# # censored_reply = "Can't talk about that one."


# ----- Auto-Role Promotion --------------------------------------------------
#
# Required when features.auto_role = true.
# Promotes members from `from_role` to `to_role` once they meet activity
# criteria. Runs periodically; the first pass happens at bot startup.

# [auto_role]
# from_role = "ROLE_ID"       # Snowflake of the role to remove
# to_role = "ROLE_ID"         # Snowflake of the role to grant
# min_age = "3d"              # Time in guild before eligible (e.g. "1h", "3d", "1w")
# min_messages = 20           # Messages sent in the guild before eligible
# require_all = false         # true = both criteria required, false = either


# ----- Join Role ------------------------------------------------------------
#
# Required when features.join_role = true.
# Assigns this role to every new member on join. Typically used to mark
# unverified/new members.

# [join_role]
# role = "ROLE_ID"            # Snowflake of the role to grant on join


# ----- Welcome Messages -----------------------------------------------------
#
# Required when features.welcome = true.
# Sends an AI-generated welcome message to the specified channel when a new
# member joins. The prompt file controls tone and content.

# [welcome]
# channel = "CHANNEL_ID"
# prompt_file = "welcome_prompt.txt"   # Relative to this config file


# ----- Minecraft Module -----------------------------------------------------
#
# Required when features.minecraft = true.
# Any sub-feature can be independently toggled.
# MC_VERIFY_URL and MC_VERIFY_SECRET in .env are required for all sub-features.

# [minecraft]
# verify = true               # !m verify command (default: true)
# donator_sync = false        # Poll MC server for donator tier role sync
# chargeback = false          # Webhook listener for chargeback alerts


# ----- Donator Sync ---------------------------------------------------------
#
# Required when minecraft.donator_sync = true.
# Polls the MC server on interval and syncs donator roles based on response.

# [minecraft.donator_sync_config]
# supporter_role = "ROLE_ID"
# premium_role = "ROLE_ID"
# check_interval = 300        # Poll interval in seconds (default: 300)


# ----- Chargeback Alerts ----------------------------------------------------
#
# Required when minecraft.chargeback = true.
# Webhook endpoint (POST /webhook/chargeback) strips roles, applies restricted
# role, posts interactive staff alert with Ban/Dismiss buttons.

# [minecraft.chargeback_config]
# staff_channel = "CHANNEL_ID"
# restricted_role = "ROLE_ID"
# staff_roles = ["MOD_ROLE_ID", "ADMIN_ROLE_ID", "OWNER_ROLE_ID"]   # Snowflakes allowed to press Ban/Dismiss; empty = no one
