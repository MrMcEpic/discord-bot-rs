name: Docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check book.toml exists
        id: check
        run: |
          if [ -f book.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "book.toml not found; skipping mdBook build."
          fi
      - name: Install mdBook
        if: steps.check.outputs.exists == 'true'
        run: |
          MDBOOK_VERSION=0.5.2
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - name: Install mdbook-mermaid
        if: steps.check.outputs.exists == 'true'
        run: |
          MDBOOK_MERMAID_VERSION=0.17.0
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - name: Build book
        if: steps.check.outputs.exists == 'true'
        run: mdbook build
      - name: Assemble Pages site (landing + book)
        if: steps.check.outputs.exists == 'true'
        run: |
          mkdir -p _site
          cp -r book _site/book
          if [ -f landing/index.html ]; then
            cp landing/index.html _site/index.html
          fi
      - name: Upload Pages artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
