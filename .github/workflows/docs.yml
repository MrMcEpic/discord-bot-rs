name: Docs

on:
  push:
    branches: [master]
    # Only run when something that actually contributes to the rendered
    # site changes. Code-only pushes don't need to fire mdBook + Pages.
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'theme/**'
      - 'landing/**'
      - 'mermaid*.js'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'book.toml'
      - 'theme/**'
      - 'landing/**'
      - 'mermaid*.js'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per-ref group cancels older runs when a newer push lands on the same
  # branch / PR. Saves CI minutes when several pushes arrive in quick
  # succession (e.g. a batch of dependabot merges). The deploy job has its
  # own narrower group below to serialize Pages deploys safely.
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check book.toml exists
        id: check
        run: |
          if [ -f book.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "book.toml not found; skipping mdBook build."
          fi
      - name: Install mdBook
        if: steps.check.outputs.exists == 'true'
        run: |
          MDBOOK_VERSION=0.5.2
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - name: Install mdbook-mermaid
        if: steps.check.outputs.exists == 'true'
        run: |
          MDBOOK_MERMAID_VERSION=0.17.0
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C /usr/local/bin
      - name: Build book
        if: steps.check.outputs.exists == 'true'
        run: mdbook build
      - name: Assemble Pages site (landing + book)
        if: steps.check.outputs.exists == 'true'
        run: |
          mkdir -p _site
          cp -r book _site/book
          if [ -f landing/index.html ]; then
            cp landing/index.html _site/index.html
          fi
      - name: Upload Pages artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # GitHub Pages permits one in-flight deploy per repo. Queue (don't
    # cancel) to avoid killing a deploy mid-upload, which can leave the
    # site in an inconsistent state.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
