name: CI

on:
  push:
    branches: [master, public-release-prep]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-main:
    name: Check main crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev libsodium-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo check --all-targets
      - name: Test
        run: cargo test

  check-gateway:
    name: Check mcp-gateway crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "mcp-gateway"
      - name: Check formatting
        working-directory: mcp-gateway
        run: cargo fmt --check
      - name: Clippy
        working-directory: mcp-gateway
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        working-directory: mcp-gateway
        run: cargo check --all-targets
      - name: Test
        working-directory: mcp-gateway
        run: cargo test

  docker-main:
    name: Build main Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-gateway:
    name: Build mcp-gateway Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./mcp-gateway
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
