name: CI

on:
  push:
    branches: [master]
    # Skip CI on changes that can't break the build: docs, changelog,
    # license, top-level README, gitignore, issue/PR templates. The
    # Docs workflow still runs on these so the Pages site rebuilds.
    # Use `[skip ci]` in a commit subject for any other one-off case.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-main:
    name: Check main crate
    runs-on: ubuntu-latest
    # Postgres service for the integration tests under `tests/`. Each test
    # uses `#[sqlx::test]`, which clones a fresh per-test database from the
    # `DATABASE_URL` target and applies the migrations under `./migrations`.
    # The credentials and DB name here are arbitrary CI-only values.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: discord_bot
          POSTGRES_PASSWORD: discord_bot_pass
          POSTGRES_DB: discord_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discord_bot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://discord_bot:discord_bot_pass@localhost:5432/discord_bot
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libopus-dev libsodium-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo check --all-targets
      - name: Test
        run: cargo test

  check-gateway:
    name: Check mcp-gateway crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "mcp-gateway"
      - name: Check formatting
        working-directory: mcp-gateway
        run: cargo fmt --check
      - name: Clippy
        working-directory: mcp-gateway
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        working-directory: mcp-gateway
        run: cargo check --all-targets
      - name: Test
        working-directory: mcp-gateway
        run: cargo test

  docker-main:
    name: Build main Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-gateway:
    name: Build mcp-gateway Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./mcp-gateway
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
