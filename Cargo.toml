[package]
name = "discord-bot"
version = "0.13.0"
edition = "2021"
description = "Multi-instance Discord bot framework written in Rust. AI chat, music, games, moderation, Minecraft integration, and a Model Context Protocol server."
license = "AGPL-3.0-or-later"
repository = "https://github.com/MrMcEpic/discord-bot-rs"
homepage = "https://mrmcepic.github.io/discord-bot-rs"
documentation = "https://mrmcepic.github.io/discord-bot-rs"
readme = "README.md"
keywords = ["discord", "bot", "serenity", "poise", "songbird"]
categories = ["network-programming", "api-bindings"]
authors = ["MrMcEpic"]

[dependencies]
serenity = { version = "0.12", default-features = false, features = [
    "client", "gateway", "model", "cache", "voice",
    "rustls_backend", "collector",
] }
poise = "0.6"
songbird = { version = "0.6", features = ["driver", "gateway", "serenity", "rustls"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "migrate", "rust_decimal"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
rand = "0.10"
async-trait = "0.1"
symphonia = { version = "0.5.2", default-features = false, features = ["mkv", "ogg", "mp3", "isomp4", "aac"] }
urlencoding = "2.1.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
toml = "1.1"
axum = "0.8"
rmcp = { version = "1", features = ["server", "transport-streamable-http-server"] }
schemars = "1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
subtle = "2"
# Pinned to match the version serenity 0.12 transitively pulls in. Used in
# src/mcp/tools.rs to read webhook tokens out of `Webhook::token`, which
# wraps them in `secrecy::Secret` to keep them out of Debug/Display output.
secrecy = "0.8"
futures = "0.3"
rust_decimal = { version = "1", features = ["db-postgres", "macros"] }

