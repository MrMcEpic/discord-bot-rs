[package]
name = "discord-bot"
version = "0.4.5"
edition = "2021"

[dependencies]
serenity = { version = "0.12", default-features = false, features = [
    "client", "gateway", "model", "cache", "voice",
    "rustls_backend", "collector",
] }
poise = "0.6"
songbird = { git = "https://github.com/beerpsi-forks/songbird.git", branch = "davey", features = ["driver", "gateway", "serenity", "rustls"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
rand = "0.8"
async-trait = "0.1"
symphonia = { version = "0.5.2", default-features = false, features = ["mkv", "ogg", "mp3", "isomp4", "aac"] }
urlencoding = "2.1.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
base64 = "0.22"
toml = "0.8"
axum = "0.8"
rmcp = { version = "1", features = ["server", "transport-streamable-http-server"] }
schemars = "1"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors"] }

