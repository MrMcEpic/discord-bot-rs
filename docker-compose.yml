services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: discord_bot_pass
      POSTGRES_DB: discord_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  examplebot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: instances/examplebot/.env
    environment:
      CONFIG_DIR: /config
    volumes:
      - ./instances/examplebot:/config:ro
    tmpfs:
      - /tmp:size=500M
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json", "-H", "Accept: application/json, text/event-stream", "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"ping\"}", "http://localhost:9090/mcp"]
      interval: 10s
      timeout: 5s
      retries: 12

  secondbot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: instances/secondbot/.env
    environment:
      CONFIG_DIR: /config
    volumes:
      - ./instances/secondbot:/config:ro
    tmpfs:
      - /tmp:size=500M
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "-X", "POST", "-H", "Content-Type: application/json", "-H", "Accept: application/json, text/event-stream", "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"ping\"}", "http://localhost:9090/mcp"]
      interval: 10s
      timeout: 5s
      retries: 12

  mcp-gateway:
    build:
      context: ./mcp-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    environment:
      GATEWAY_PORT: "9100"
      INSTANCES: "examplebot=http://examplebot:9090,secondbot=http://secondbot:9090"
      MCP_AUTH_TOKEN: "${MCP_GATEWAY_AUTH_TOKEN:-}"
    depends_on:
      examplebot:
        condition: service_healthy
      secondbot:
        condition: service_healthy

volumes:
  pgdata:
