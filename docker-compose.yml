# ============================================================================
# discord-bot-rs — Docker Compose
# ============================================================================
#
# Default configuration runs a single bot instance from ./instances/example
# plus a bundled PostgreSQL and the MCP gateway.
#
# To use a different instance directory:
#     INSTANCE_DIR=./instances/mybot docker compose up -d
#
# To run multiple bot instances, copy the `bot` service definition, rename it,
# and point it at a different instance directory. See
# docs/deployment/multi-instance-deployment.md for the full pattern.
# ============================================================================

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: discord_bot
      POSTGRES_PASSWORD: discord_bot_pass
      POSTGRES_DB: discord_bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${INSTANCE_DIR:-./instances/example}/.env
    environment:
      CONFIG_DIR: /config
    volumes:
      - ${INSTANCE_DIR:-./instances/example}:/config
    tmpfs:
      - /tmp:size=500M
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null --connect-timeout 2 http://localhost:9090/mcp"]
      interval: 10s
      timeout: 5s
      retries: 12

  mcp-gateway:
    build:
      context: ./mcp-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    environment:
      GATEWAY_PORT: "9100"
      # Comma-separated instance_name=url pairs. Defaults to routing to the
      # single `bot` service. Override for multi-instance setups:
      #     INSTANCES="bot1=http://bot1:9090,bot2=http://bot2:9090" docker compose up -d
      INSTANCES: "${INSTANCES:-bot=http://bot:9090}"
      MCP_AUTH_TOKEN: "${MCP_GATEWAY_AUTH_TOKEN:-}"
      RUST_LOG: "info"
    depends_on:
      bot:
        condition: service_healthy

volumes:
  pgdata:
